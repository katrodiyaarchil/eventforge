

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventforge_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d eventforge_gateway || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    
  redis:
    image: redis:7-alpine
    container_name: eventforge_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eventforge_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
  
  gateway:
    build:
      context: ./
      dockerfile: Dockerfile.gateway
    container_name: eventforge_gateway
    restart: always
    ports:
      - "8000:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    environment:
      - GATEWAY_DB_USER=root
      - GATEWAY_DB_PASSWORD=password
      - GATEWAY_DB_HOST=postgres
      - GATEWAY_DB_PORT=5432
      - GATEWAY_DB_NAME=eventforge_gateway
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_TOPIC_TRANSACTIONS_RAW=transactions.raw

  relay:
    build:
      context: ./
      dockerfile: Dockerfile.relay

    container_name: eventforge_relay
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    
    environment:
      - KAFKA_TOPIC_TRANSACTIONS_RAW=transactions.raw
      - KAFKA_URL=kafka:29092
      - GATEWAY_DB_USER=root
      - GATEWAY_DB_PASSWORD=password
      - GATEWAY_DB_HOST=postgres
      - GATEWAY_DB_PORT=5432
      - GATEWAY_DB_NAME=eventforge_gateway
  processor:
    build:
      context: .
      dockerfile: ./services/processor/Dockerfile
    container_name: eventforge_processor
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_TOPIC_TRANSACTIONS_RAW=transactions.raw
      - KAFKA_TOPIC_TRANSACTIONS_SCORED=transactions.scored
      - KAFKA_URL=kafka:29092

volumes:
  postgres_data:
    driver: local
    name: eventforge_postgres_data
  redis_data:
    driver: local
    name: eventforge_redis_data
  kafka_data:
    driver: local
    name: eventforge_kafka_data